[project]
name = "git-raven"
version = "0.1.0"
description = "A pixel-art raven drawn from your GitHub activity."
requires-python = ">=3.9"
dependencies = ["pillow>=10"]

[project.scripts]
git-raven = "git_raven.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["git_raven"]
